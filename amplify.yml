version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd apps/web && npm ci
    build:
      commands:
        - cd apps/web && npm run build
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: apps/web/out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
